<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Exchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .header {
            background-color: #222; /* Darker shade for the header */
            text-align: center;
            padding: 20px 0;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header img {
            width: 200px; /* Increased size of the logo */
            height: auto;
            position: relative;
            z-index: 1;
        }
        .header .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.bdgameghor.net/wp-content/uploads/2022/05/BD-GAME-Ghor-1-1024x158.png');
            background-size: cover;
            background-position: center;
            z-index: 0;
            opacity: 0.5; /* Adjust the opacity as needed */
        }
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px; /* Add some space below the navigation buttons */
        }
        .navbar a {
            display: block;
            color: white;
            text-align: center;
            padding: 10px 20px;
            text-decoration: none;
            margin: 0 10px;
            border: 2px solid #555;
            border-radius: 0; /* Square outline */
            background-color: #333; /* Solid background color */
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s ease; /* Add transition for smooth animation */
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
            transform: scale(1.1);
        }
        .products {
            font-size: 24px;
            color: white; /* White color */
            margin-top: 20px;
            text-align: center;
            width: 100%;
        }
        .content {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px; /* Add some space below the products text */
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            height: 100%;
            width: 100%;
        }
        .button {
            background-color: #222; /* Darker shade of gray */
            border: 2px solid #555;
            border-radius: 0; /* Square outline */
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }
        .button:hover {
            transform: scale(1.1);
            background-color: #444;
        }
        .button.background-1 {
            background-image: url('https://raw.githubusercontent.com/vilished/ffexchange/refs/heads/main/image.png');
            background-size: cover;
            background-position: center;
        }
        .button.background-2 {
            background-image: url('https://raw.githubusercontent.com/vilished/ffexchange/refs/heads/main/image%20(3).png');
            background-size: cover;
            background-position: center;
            pointer-events: none; /* Make the button unresponsive */
        }
        .out-of-stock {
            color: red;
            font-size: 16px;
            margin-top: 10px;
        }
        .price-text {
            color: white;
            font-size: 24px; /* Increased font size */
            margin-top: 10px;
            font-weight: bold; /* Make the text bold */
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="navbar">
            <a href="#home">Home</a>
            <a href="#about">About Us</a>
            <a href="#ffdiamonds">FF Diamonds</a>
        </div>
        <div class="background"></div>
        <img src="https://raw.githubusercontent.com/vilished/ffexchange/refs/heads/main/ff-exchange-logo.png" alt="FF Exchange Logo">
    </div>

    <div class="products">Products ✨</div>

    <div class="content">
        <div class="button-container">
            <a href="topup/index.html" class="button background-1"></a>
            <div class="price-text">৩০০ টাকা - ১২০০ ডায়মন্ড 💎</div>
            <button class="button background-2"></button>
            <div class="out-of-stock">(Out of Stock)</div>
            <button class="button background-2"></button>
            <div class="out-of-stock">(Out of Stock)</div>
            <button class="button background-2"></button>
            <div class="out-of-stock">(Out of Stock)</div>
        </div>
    </div>

</body>
</html>
