<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Exchange - Topup</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .header {
            background-color: #222; /* Darker shade for the header */
            text-align: center;
            padding: 20px 0;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header img {
            width: 200px; /* Increased size of the logo */
            height: auto;
            position: relative;
            z-index: 1;
        }
        .header .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.bdgameghor.net/wp-content/uploads/2022/05/BD-GAME-Ghor-1-1024x158.png');
            background-size: cover;
            background-position: center;
            z-index: 0;
            opacity: 0.5; /* Adjust the opacity as needed */
        }
        .navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px; /* Add some space below the navigation buttons */
        }
        .navbar a {
            display: block;
            color: white;
            text-align: center;
            padding: 10px 20px;
            text-decoration: none;
            margin: 0 10px;
            border: 2px solid #555;
            border-radius: 0; /* Square outline */
            background-color: #333; /* Solid background color */
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s ease; /* Add transition for smooth animation */
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
            transform: scale(1.1);
        }
        .content {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px; /* Add some space below the products text */
        }
        .top-image {
            width: 40%;
            max-width: 300px;
            height: auto;
            margin-top: 20px;
        }
        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .form-label {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        .form-input {
            background-color: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 20px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            font-size: 18px; /* Increased font size */
        }
        .centered-text {
            text-align: center;
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
        }
        .continue-button {
            background-color: green;
            color: white;
            border: 2px solid #555;
            border-radius: 5px;
            padding: 15px 30px;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
            font-size: 20px; /* Increased font size */
            font-weight: bold;
        }
        .continue-button:hover {
            background-color: #4CAF50;
            transform: scale(1.1);
        }
        .payment-info {
            text-align: center;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .copy-button {
            background-color: #333;
            color: white;
            border: 2px solid #555;
            border-radius: 5px;
            padding: 10px;
            margin-left: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
            font-size: 20px; /* Increased font size */
            font-weight: bold;
        }
        .copy-button:hover {
            background-color: #555;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="navbar">
            <a href="../index.html">Home</a>
            <a href="#about">About Us</a>
            <a href="#ffdiamonds">FF Diamonds</a>
        </div>
        <div class="background"></div>
        <img src="https://raw.githubusercontent.com/vilished/ffexchange/refs/heads/main/ff-exchange-logo.png" alt="FF Exchange Logo">
    </div>

    <div class="form-container">
        <div class="form-label">আপনার নাম :</div>
        <input type="text" class="form-input" placeholder="Enter your name">

        <div class="form-label">আপনার UID :</div>
        <input type="text" class="form-input" placeholder="Enter your UID">

        <div class="form-label">যে Number থেকে টাকা পাঠাবেন :</div>
        <input type="text" class="form-input" placeholder="Enter the number">
    </div>

    <div class="payment-info">
        এই নাম্বার এ টাকা পাঠান (বিকাশ / নগদ) - 01742670516
        <button class="copy-button" onclick="copyToClipboard('01742670516')">Copy</button>
    </div>

    <a href="success.html" class="continue-button">Continue</a>

    <div class="centered-text">
        ৩০০ টাকা - ১২০০ ডায়মন্ড 💎
    </div>

    <img src="https://raw.githubusercontent.com/vilished/ffexchange/refs/heads/main/image%20(4).png" alt="Top Image" class="top-image">

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(function() {
                alert('Number copied to clipboard!');
            }).catch(function(err) {
                console.error('Could not copy text: ', err);
            });
        }
    </script>

</body>
</html>
